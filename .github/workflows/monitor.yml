name: Monitor roles

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC; the first step gates the exact weekday
    # 8 AM-8 PM America/New_York window across daylight/standard time.
    - cron: "13,43 0-1,12-23 * * *"

permissions:
  contents: write

concurrency:
  group: role-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check weekday monitor window
        id: window
        run: |
          day=$(TZ=America/New_York date +%u)
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$day" -le 5 ] && [ "$hour" -ge 8 ] && [ "$hour" -le 20 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate monitor parser
        if: steps.window.outputs.run == 'true'
        run: npm run validate

      - name: Run monitor
        if: steps.window.outputs.run == 'true'
        run: npm run monitor
        env:
          FETCH_TIMEOUT_MS: "10000"
          FETCH_RETRIES: "1"
          FETCH_RETRY_BASE_MS: "350"
          ATS_SOURCE_CONCURRENCY: "12"
          SOURCE_SCAN_DEADLINE_MS: "90000"
          DOUBLE_CHECK_TIMEOUT_MS: "20000"
          HTML_DETAIL_CONCURRENCY: "4"
          DISCOVERY_CONCURRENCY: "8"
          DISCOVERY_LIMIT: "500"
          DISCOVERY_REFRESH_HOURS: "168"
          DISCOVERY_ERROR_REFRESH_HOURS: "6"
          SITEMAP_DETAIL_LIMIT: "30"
          DISCOVERY_FEED_CONCURRENCY: "8"
          DISCOVERY_FEED_VERIFY_LIMIT: "2000"
          DISCOVERY_FEED_TIMEOUT_MS: "15000"
          DISCOVERY_FEED_REVERIFY_HOURS: "24"
          MIN_ATS_SUCCESS_PERCENT: "75"
          STALE_AFTER_DAYS: "21"

      - name: Commit generated updates
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md NEW_GRAD.md INTERNSHIPS.md data/roles.json data/roles.csv data/latest_scan.json data/coverage.json data/source_discovery.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Update 2027 role board"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort
              echo "Unable to rebase generated updates onto the latest main branch."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying ($attempt/3)."
            sleep $((attempt * 3))
          done
          echo "Unable to push generated updates after 3 attempts."
          exit 1
