name: Monitor roles

on:
  workflow_dispatch:
  repository_dispatch:
    types: [role-monitor]
  schedule:
    # GitHub may delay or drop scheduled events. Four staggered attempts per
    # hour make it much less likely that a short-lived posting is missed while
    # keeping the monitor inside the requested Eastern-time business window.
    - cron: "7,22,37,52 9-20 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: role-monitor
  cancel-in-progress: false

jobs:
  window:
    name: Check monitor window
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - name: Check weekday monitor window
        id: window
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/New_York', weekday: 'short', hour: '2-digit', hourCycle: 'h23'
            }).formatToParts(now);
            const part = type => parts.find(p => p.type === type)?.value;
            const inWindow = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].includes(part('weekday'))
              && Number(part('hour')) >= 9 && Number(part('hour')) < 20;
            const run = context.eventName === 'workflow_dispatch' || inWindow;
            core.setOutput('run', String(run));
            core.info(run ? 'Monitor authorized for this run.' : 'Monitor skipped: outside weekday 09:00-20:00 (end exclusive) Eastern window.');
            await core.summary.addHeading(run ? 'Monitor will run' : 'No scan performed')
              .addTable([
                [{data: 'Trigger', header: true}, context.eventName],
                [{data: 'Checked at (UTC)', header: true}, now.toISOString()],
                [{data: 'Allowed window', header: true}, 'Monday-Friday, 09:00-20:00 (end exclusive) America/New_York'],
                [{data: 'Decision', header: true}, run ? 'Run scan' : 'Skip: arrived outside allowed hours']
              ]).addRaw('Scheduled events can arrive late or be dropped by GitHub. A green window check is not a completed scan. Manual dispatch can run outside the window.').write();

  monitor:
    name: Scan and publish roles
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate monitor parser
        run: npm run validate

      - name: Run monitor
        run: npm run monitor
        env:
          FETCH_TIMEOUT_MS: "10000"
          FETCH_RETRIES: "1"
          FETCH_RETRY_BASE_MS: "350"
          ATS_SOURCE_CONCURRENCY: "12"
          SOURCE_SCAN_DEADLINE_MS: "90000"
          DOUBLE_CHECK_TIMEOUT_MS: "20000"
          HTML_DETAIL_CONCURRENCY: "4"
          DISCOVERY_CONCURRENCY: "8"
          DISCOVERY_LIMIT: "500"
          DISCOVERY_REFRESH_HOURS: "168"
          DISCOVERY_ERROR_REFRESH_HOURS: "6"
          SITEMAP_DETAIL_LIMIT: "30"
          DISCOVERY_FEED_CONCURRENCY: "8"
          DISCOVERY_FEED_VERIFY_LIMIT: "2000"
          DISCOVERY_FEED_TIMEOUT_MS: "15000"
          DISCOVERY_FEED_REVERIFY_HOURS: "24"
          MIN_ATS_SUCCESS_PERCENT: "75"
          STALE_AFTER_DAYS: "21"

      - name: Commit generated updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md NEW_GRAD.md INTERNSHIPS.md new-grad internships data/roles.json data/roles.csv data/latest_scan.json data/coverage.json data/source_discovery.json data/company_catalog.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Update 2027 role board"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort
              echo "Unable to rebase generated updates onto the latest main branch."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying ($attempt/3)."
            sleep $((attempt * 3))
          done
          echo "Unable to push generated updates after 3 attempts."
          exit 1

      - name: Report scan result
        if: always()
        env:
          MONITOR_STATUS: ${{ job.status }}
        run: |
          echo "## Scan result: $MONITOR_STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MONITOR_STATUS" = "success" ]; then
            node --input-type=module -e "import fs from 'node:fs'; const c = JSON.parse(fs.readFileSync('data/coverage.json')); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Scanned at: ' + c.scanned_at + '\n\nOfficial sources healthy: ' + c.ok_sources + '/' + c.unique_sources_attempted + '\n');"
          else
            echo "The scan or publication failed. The public board may still show an older scan; inspect the failed step." >> "$GITHUB_STEP_SUMMARY"
          fi
